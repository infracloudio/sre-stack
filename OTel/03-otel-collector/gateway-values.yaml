# OTel Collector — GATEWAY tier (Deployment, cluster-wide)
#
# Receives from agents over OTLP, applies cluster-level processing, exports
# to backends. Step 3 wires traces → Tempo only; logs (step 04) and metrics
# (step 05) get exporters wired up later.
mode: deployment
replicaCount: 1
fullnameOverride: otel-gateway

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true

# Expose OTLP via NodePort so you can `curl` from your laptop too
service:
  type: NodePort

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    nodePort: 30317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    nodePort: 30318
    protocol: TCP

resources:
  limits:
    cpu: 512m
    memory: 1Gi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      send_batch_size: 1024
      timeout: 5s
    # k8sattributes auto-injected by preset

  exporters:
    # Traces → Tempo
    otlp/tempo:
      endpoint: tempo.observability.svc:4317
      tls:
        insecure: true
    # Logs (Loki OTLP) and Metrics (Prometheus remote_write) wired in steps 04 / 05
    debug:
      verbosity: basic

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [debug]   # placeholder — replaced in step 05
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [debug]   # placeholder — replaced in step 04
