# hotrod overlay for STACK_MODE=aks only, applied by setup-hotrod. Builds the
# shared app/hotrod and adds the Azure spot toleration: every AKS workload node
# carries kubernetes.azure.com/scalesetpriority=spot:NoSchedule
# (docs/architectural-decisions.md AD-003). EKS/local build app/hotrod as-is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../app/hotrod

patches:
  - target:
      kind: Deployment
      name: hotrod
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
            effect: NoSchedule
