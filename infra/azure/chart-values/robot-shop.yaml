# robot-shop values overlay for STACK_MODE=aks only, passed after the chart's
# own values.yaml by setup-robot-shop. Every AKS workload node carries
# kubernetes.azure.com/scalesetpriority=spot:NoSchedule (docs/
# architectural-decisions.md AD-003), so each workload tolerates it. Helm
# replaces lists, so the persistent-pool workloads restate their persistent
# toleration. EKS/local install the chart without this file.

cart:
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

catalogue:
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

dispatch:
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

payment:
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

ratings:
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

shipping:
  # The chart's 200m CPU limit starves the Java service: garbage collection
  # cannot keep up ("GC overhead limit exceeded") and the readiness probe
  # fails, leaving the pod 1/2 Ready (specs/006 research, specs/007 tasks D21).
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

user:
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

web:
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

mongodb:
  tolerations:
    - key: "persistent"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

mysql:
  tolerations:
    - key: "persistent"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

rabbitmq:
  tolerations:
    - key: "persistent"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

redis:
  tolerations:
    - key: "persistent"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

mysqlseeder:
  # Outside the mesh the seed job's plaintext connection hangs at MySQL's
  # server-first handshake (the sidecar waits for the client to speak). Inside
  # the mesh it reaches MySQL the way shipping does. Native sidecars let the Job
  # still complete. Excluding MySQL's port from its sidecar instead breaks the
  # mesh clients (automatic mTLS), so do not (specs/007 tasks D21).
  injectSidecar: true
  # Seed load: the chart's 200m CPU limit lets the 64 MB import stall (story 006
  # found the client idle with no MySQL session). More CPU makes a stall rare, and
  # fileTimeoutSeconds bounds each file; a marker table tells a hung client
  # from a failed import, and a failed one is retried by the Job (specs/007 tasks D21).
  fileTimeoutSeconds: 150
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 500Mi
  tolerations:
    - key: "persistent"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
