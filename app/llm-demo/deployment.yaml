apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-demo
  namespace: monitoring
  labels:
    app: llm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-demo
  template:
    metadata:
      labels:
        app: llm-demo
    spec:
      containers:
        - name: llm-demo
          # Built locally and imported directly into k3d's containerd via
          # `k3d image import` -- no external registry needed. If you're
          # NOT using k3d, replace this with a real registry path and
          # remove imagePullPolicy: Never.
          image: llm-demo:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: LITELLM_BASE_URL
              value: "http://litellm-proxy.monitoring:4000/v1"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: DEFAULT_MODEL
              value: "local-llama"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway.monitoring:4318"
            - name: OPENLIT_ZERO_CODE
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llm-demo
  namespace: monitoring
spec:
  selector:
    app: llm-demo
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
