# Copy this to litellm-secrets.yaml, fill in real values, and apply it.
# NEVER commit the filled-in version -- it's already in .gitignore.
#
# Keys here are referenced two ways by monitoring/chart-values/litellm.yaml:
#   - LITELLM_MASTER_KEY: via masterkeySecretName/masterkeySecretKey
#   - OPENAI_API_KEY / ANTHROPIC_API_KEY: via environmentSecrets, then
#     picked up in proxy_config as os.environ/OPENAI_API_KEY etc.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: monitoring
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "sk-demo-change-me"
  OPENAI_API_KEY: "sk-...optional-if-using-gpt-4o-mini-model..."
  ANTHROPIC_API_KEY: "sk-ant-...optional-if-using-claude-haiku-model..."
