{{- $mysqlUser := "" }}
{{- if ne .Values.stack_mode "eks" }}
{{- $mysqlUser = "root" }}
{{- else }}
{{- $mysqlUser = "admin" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-seeder
  labels:
    service: mysql-seeder
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: mysql-seeder
        image: hashfyre/robotshop-seeder
        args:
          - /bin/bash
          - -c
{{- if .Values.mysqlseeder.fileTimeoutSeconds }}
          # Bounded import: a stalled mysql client is killed after
          # fileTimeoutSeconds, the container fails and the Job retries
          # (the seed files drop and recreate their tables, so a rerun is safe).
          - |
            /wait || exit 1
            for f in /opt/seeds/*.sql; do
              echo "Adding file: $f"
              MYSQL_PWD="$MYSQL_PASSWORD" timeout {{ .Values.mysqlseeder.fileTimeoutSeconds }} \
                mysql -h "$MYSQL_HOST" -u "$MYSQL_USER" < "$f" || exit 1
            done
{{- else }}
          - /wait && /opt/seeds/seeder.sh
{{- end }}
        env:
          - name: MYSQL_HOST
            value: {{ .Values.mysql_host }}
          - name: MYSQL_PASSWORD
            value: {{ .Values.mysql_root_password }}
          - name: MYSQL_PORT
            value: "3306"
          - name: MYSQL_USER
            value: {{ $mysqlUser }}
          - name: TIMEOUT
            value: "600"
          - name: WAIT_HOSTS
            value: {{ .Values.mysql_host }}:3306
          - name: WAIT_HOSTS_TIMEOUT
            value: "300"
          - name: WAIT_HOST_CONNECT_TIMEOUT
            value: "30"
          - name: WAIT_SLEEP_INTERVAL
            value: "30"
        resources:
          {{- toYaml .Values.mysqlseeder.resources | nindent 12 }}
      restartPolicy: OnFailure
      {{- with .Values.mysqlseeder.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mysqlseeder.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mysqlseeder.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  backoffLimit: 4      