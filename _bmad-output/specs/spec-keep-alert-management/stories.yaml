- id: "1"
  title: Robot-shop alert rules, with the payment latency threshold tuned
  description: |-
    Priority: main. Size: 1 to 2 days. Needs: none. AD numbers: none of AD-008 to AD-013 apply. Capability: CAP-2.

    Problem: Robot-shop has no Prometheus alert rules, so a fault produces no alert at all and nothing downstream (Keep, Slack) has anything to react to.

    Outcome: The rules live in `infra/azure/alert-rules/robot-shop.yaml` as a standalone PrometheusRule carrying the label `release: prometheus-stack`, applied by `kubectl apply` from the AKS branch of the monitoring setup, the way `infra/azure/dashboards/` is applied (makefile line 167). It is AKS-only, so k3d and EKS are untouched. Reason: same pattern as `infra/azure/dashboards` and scenario-02, and tuning a threshold is one `kubectl apply`, not a `helm upgrade` of `prometheus-stack`. Rules exist for OOM kills, container restarts, unavailable replicas, slow requests and a high share of 5xx responses. Each carries a severity Keep recognises (critical, error, high, warning or info) and `namespace` and `service` labels. During the cart OOM fault (`make aks-cart-oom-start`, load generator running), the OOM kill, restart, unavailable-replica and 5xx alerts show as firing on the Prometheus Alerts page. The slow-request alert fires only if latency crosses the tuned threshold. With the load generator running and no fault, nothing fires for 30 minutes. The tuned payment latency threshold and the reason for it are written down. AKS `make cleanup` deletes the cluster (`cleanup-cluster`), so the PrometheusRule goes with it; `helm uninstall` alone would not remove a file applied with `kubectl`.

    Out of scope: Alertmanager and Keep (stories 2 and 3). Rules for hotrod. Grafana alerts. Dashboards. The unused Bookinfo rule in `monitoring/chart-values/prometheus-values.yaml` under `additionalPrometheusRulesMap` (shared values, k3d and EKS use it): log it as a follow-up, do not touch it here.

    Must keep working (AGENTS.md): `make setup-local` and the EKS path are untouched. Existing Prometheus, Grafana and Beyla behaviour. The cart OOM scenario still starts and reverts. `make lint` passes.

    Live check: the quiet-for-30-minutes run and the fault run, on AKS.
  spec_checkpoint: true
  done_checkpoint: true
