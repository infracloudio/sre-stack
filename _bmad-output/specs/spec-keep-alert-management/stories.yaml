- id: "5b"
  title: One resolved message in Slack when the incident closes
  description: |-
    Priority: main. Size: 1 to 2 days. Needs: story 5a. AD numbers: AD-011 (rule 2, workflows as files). Capabilities: CAP-5 (resolved message), CAP-7 (second workflow).

    Problem: Slack is told when an incident opens (5a) but never when it closes, so the channel shows a fault that seems to run forever. Keep has no "incident resolved" trigger, only created, updated and deleted (SPEC), and the try-out never tried the updated trigger.

    Outcome: `infra/azure/keep/workflows/` gets a second workflow file, separate from story 5a's, triggered on incident updated. Incident triggers take only a list of events, with no condition or filter (Keep `keep/workflowmanager/workflowmanager.py:147-154`, commit e5cd8698), so the "status is resolved" condition goes on the Slack action as an `if:`, not on the trigger. The rules engine sends "updated" for every alert event added to a visible incident (`keep/rulesengine/rulesengine.py:206-208`), so a condition on status alone can post more than once. The story therefore follows Keep's own pattern in `examples/workflows/incident-tier-escalation.yml`: the action's `if:` checks that the status is resolved and that a marker (for example `resolved_notified`) is not set, and the action sets the marker with `enrich_incident`. Keep loads incident enrichments before each run (`workflowmanager.py:159-162`). The action posts one short message to the same Slack channel through the `slack` provider: the incident name, that it resolved, and the "Open in Keep" link. No summary call. After `make aks-cart-oom-revert`, once the last alert clears and Keep resolves the incident, exactly one resolved message appears in Slack, not one per incident update. In the try-out the incident resolved about 8 minutes after the revert (research.md section 5), so the check waits that long and counts messages over a further 10 minutes. After the live run, `plan.md` records two known limits: whether two near-simultaneous updates can both post (the 10-minute count shows it), and that a resolved incident which reopens keeps the marker, so its second close posts nothing (accepted for the demo; a follow-up story if needed).

    Out of scope: any change to the opened-incident workflow. A new summary at resolve time. Fixing Keep's `end_time` or time-to-resolve (SPEC non-goals). A message when an incident is deleted.

    Must keep working (AGENTS.md): story 5a's opened-incident message and its workflow file, unchanged. One incident per fault (story 4). `setup-keep` stays idempotent and restarts nothing when the workflows folder is unchanged (the hash rule from 5a). `make setup-aks` without Keep secrets still finishes. `make lint` passes.

    Live checks from the architecture decisions: (1) the story starts with the one thing the try-out never ran: does a workflow triggered on incident updated, with the `if:` on status resolved and the marker, fire when an incident resolves, and how many times does it fire over the next ten minutes? The count and the way the workflow was made to fire once are recorded in `plan.md`; (2) the opened-incident workflow does not fire a second summary when the incident is updated or resolved, and the resolved workflow does not fire while the incident is still open; (3) the final proof is the exact-once count above, on a real fault and revert. If no condition can make the message fire exactly once, stop and return to the spec; do not ship a version that posts more than once.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
