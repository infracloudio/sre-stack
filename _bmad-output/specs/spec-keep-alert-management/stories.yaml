- id: "6a"
  title: Keep login on, with the real API keys proven
  description: |-
    Priority: main. Size: 1 to 2 days. Needs: stories 3, 4 and 5b. AD numbers: AD-009 (rules 1 to 4), AD-008 (rules 1, 2, 3 and 4), AD-013 (rule 2). Capability: CAP-6 (login part).

    Problem: Keep runs in `NOAUTH`, where every request with any API key is treated as admin. It cannot be reachable from outside the cluster in that mode (AD-009), and since then no story has proven that Alertmanager's key or the setup key is actually checked.

    Outcome: Keep requires a login. `AUTH_TYPE=DB` (uppercase) is set on backend and frontend. The one default user's name comes from `.env` (`KEEP_DEFAULT_USERNAME`); its password, `KEEP_JWT_SECRET` and `NEXTAUTH_SECRET` come from the new Secret `sre-keep-auth`, built by `setup-keep` from the generated files `login-password`, `jwt-secret` and `nextauth-secret` in the secrets folder, and wired through `backend.envFromSecrets` and `frontend.envFromSecrets`. `KEEP_FORCE_RESET_DEFAULT_PASSWORD=true` makes `login-password` the source of truth on every start. The login password is never printed; the operator reads it from the file. `NEXTAUTH_URL` keeps the chart default `http://localhost:3000` in this story, because sign-in goes through `kubectl port-forward` and the route to `keep.demo.local` does not exist yet; story 6b sets it to `http://keep.demo.local` (AD-009 rule 1). The login page loads through `kubectl port-forward`, the default user signs in, and new alerts show after a page refresh (live updates need the websocket route of story 6b: through a port-forward the try-out's websocket fails). A request with a made-up API key is rejected. Alertmanager still delivers with its real key. The story 4 to 5b work (rule, providers, workflows) still works with the login on.

    Out of scope: the gateway route and `keep.demo.local` (6b), and live updates without a refresh. Single sign-on, roles, more users. TLS. Changing the password in Keep's UI (a restart resets it, AD-009). Any README work (story 7).

    Must keep working (AGENTS.md): the whole earlier chain: one cart OOM fault still ends in one incident, a Slack summary and one resolved message. `setup-keep` stays idempotent and a second run restarts nothing. `make setup-aks` without Keep secrets still finishes. `make setup-local` and EKS untouched. `make lint` passes, including its secrets check.

    Live checks from the architecture decisions: (1) the `AUTH_TYPE=DB` login the try-out never ran: the default user signs in with `login-password` through the port-forward; (2) a changed `login-password`, after a re-run of `make setup-keep`, signs in with the new value and refuses the old (`KEEP_FORCE_RESET_DEFAULT_PASSWORD`, AD-009 rule 1); (3) the real key checks moved here from stories 3 and 4, since `NOAUTH` accepted anything: Alertmanager's deliveries return 202 with the right key and 401 with a wrong one, a made-up key is rejected, and `setup-keep`'s admin key still creates and updates the correlation rule with the login on (AD-009 rule 3); (4) after a key-file change and a re-run of both `setup-aks-prometheus-stack` and `make setup-keep`, deliveries still return 202 with the new value (AD-008 rule 4); this check is the cut point if the story runs long; (5) if seeding does not work, the fallback is `POST /settings/apikey`, and if that fails too, stop and return to the spec (AD-009 rule 4).
  spec_checkpoint: true
  done_checkpoint: true
