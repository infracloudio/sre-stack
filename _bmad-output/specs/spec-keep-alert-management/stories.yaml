- id: "5a"
  title: Slack summary from Fireworks when an incident opens, with providers built from the secrets folder
  description: |-
    Priority: main. Size: 1 to 2 days. Needs: story 4. AD numbers: AD-011 (rules 2 and 3), AD-008 (rules 1, 2, 4 and 5), AD-010 (rule 2, the link), AD-013 (rule 2, the env lists). Capabilities: CAP-5 (opened message), CAP-7 (providers and first workflow).

    Problem: Keep now opens one incident per fault (story 4), but nobody is told. The try-out produced a good summary only through hand-made provider setup and a workflow pasted in by hand, which a reinstall loses.

    Outcome: `infra/azure/keep/providers.template.json` holds every non-secret provider field. `setup-keep` fills in the Fireworks key and the Slack webhook URL from the untracked secrets folder with `jq` and writes the result as `KEEP_PROVIDERS` into the Secret `sre-keep-providers`, loaded through `backend.envFromSecrets`. The providers are named `fireworks` (type `litellm`, `api_url` `https://api.fireworks.ai/inference/v1`) and `slack`. `infra/azure/keep/workflows/` holds the opened-incident workflow as a Keep workflow file, starting from the try-out's `notify-slack-with-context.yaml`: model `accounts/fireworks/models/glm-5p3-flash`, `max_tokens` 10000, then a Slack post that carries the summary, the severity, the alert count and an "Open in Keep" link to `http://keep.demo.local/incidents/<id>`. The workflow refers to the providers by the two fixed names, not by the try-out's `keep-alerts-srestack`. `setup-keep` loads the folder into the ConfigMap `sre-keep-workflows`, mounts it, and sets `KEEP_WORKFLOWS_DIRECTORY`. Keep reads `KEEP_PROVIDERS` and the workflows only at backend start, so `setup-keep` restarts `keep-backend` when either the `sre-keep-providers` content or the workflows folder changes, decided by a hash; a run with nothing changed restarts nothing. `slack-webhook.url` now joins `fireworks.key` as a required supplied file: `setup-keep` run on its own stops when either is missing and names it, and inside `make setup-aks` it skips Keep with a message that lists the missing files. The README or `plan.md` says that `slack-webhook.url` is now required. During the cart OOM fault, Slack shows a Fireworks summary within two minutes of the incident opening. It names the failing service and what to check first. After `helm uninstall keep` and `make setup-keep` the providers and the workflow are back with no manual API or UI step, and no secret value appears in any repo file, values file or ConfigMap.

    Out of scope: the resolved message (story 5b). The login and the gateway route (6a, 6b): the "Open in Keep" link starts to resolve only once 6b is live. Jira, PagerDuty, automatic remediation. Grafana or Tempo links in the message. The "AI Summary" button (a later story).

    Must keep working (AGENTS.md): stories 2 to 4 as built, including one incident per fault and Alertmanager delivery. `setup-keep` stays idempotent: a second run changes nothing and restarts nothing. `make setup-aks` without Keep secrets still finishes. `make setup-local` and EKS untouched. `make lint` passes, including its secrets check.

    Live checks from the architecture decisions: (1) the Fireworks reply is not empty with `max_tokens` 10000 on a real incident, since the model reasons first (SPEC, research.md section 5); (2) after `helm uninstall keep`, `sre-keep-providers` still exists, and after the next `make setup-keep` both providers and the workflow are present and the next OOM fault posts a summary; (3) what start-up provisioning does is observed and written down in `plan.md`, as AD-011 rule 2 says it is not a gate: the workflow loads from the mounted ConfigMap, the ConfigMap's `..data` entries are ignored, and a deleted workflow file is gone after the next backend restart; (4) a search of the tracked files, the rendered ConfigMap, the output of `helm get values keep` and the output of `helm get manifest keep` finds neither the Fireworks key nor the Slack webhook URL; (5) change `slack-webhook.url` (for example to a second test webhook), re-run `make setup-keep`, and the next message arrives on the new webhook.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
