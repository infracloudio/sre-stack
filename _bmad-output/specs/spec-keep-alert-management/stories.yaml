- id: "2"
  title: Install Keep on AKS with `make setup-keep`
  description: |-
    Priority: main. Size: 1 to 2 days. Needs: none (runs in parallel with story 1). AD numbers: AD-008, AD-013, AD-011 (file layout), AD-003. Capability: CAP-1.

    Problem: There is no Keep in the stack, and no safe way to install it: the chart's defaults send usage data out, leave several images floating, run MySQL with no root password and put the database on a hostPath volume.

    Outcome: `make setup-keep` on AKS brings the backend, frontend, websocket server and MySQL pods to Running on the `workload=o11y` pool, with the database volume on gp2, telemetry off and every chart image pinned to an exact version. Everything is in `infra/azure/chart-values/keep.yaml` and `infra/azure/keep/` (chart `keephq/keep` 0.1.97). The Fireworks key is read from the untracked secrets folder and reaches Keep as the Secret `sre-keep-ai-env`, with `OPENAI_MODEL_NAME` set on backend and frontend. The database root password is generated once into the folder and reaches Keep as `sre-keep-db`. No Secret of ours is named `keep-*`. Run again, it changes nothing and restarts nothing. Run on its own with `fireworks.key` missing, it stops before touching the cluster and names the file. Inside `make setup-aks` with the file missing, Keep is skipped with a message and the rest of AKS setup finishes. The UI loads through `kubectl port-forward`, with Keep running without a login (story 6a adds it).

    Out of scope: Alertmanager, API keys, the correlation rule, Slack and Fireworks providers, workflows, the login, the gateway route and `get-service-endpoints` (stories 3 to 6b). Any Keep install on k3d or EKS.

    Must keep working (AGENTS.md): `make setup-local` and the EKS path. `make setup-aks` without Keep secrets still finishes. Every other pod on the o11y pool still schedules. `make lint` passes, including Helm lint on the new values file. AKS `make cleanup` still removes everything, since it deletes the cluster.

    Live checks from the architecture decisions (AD-013): (1) the exact tag chosen for each of MySQL, the uninstall hook image and busybox is recorded in `plan.md` and the pod runs on it; (2) the hook image has a shell with `grep` and `xargs` and kubectl, shown by a real `helm uninstall keep` that removes the `keep-*` Secrets without error; after `helm uninstall keep`, the Secrets `sre-keep-ai-env` and `sre-keep-db` still exist (this proves the naming rule), and a second `make setup-keep` brings Keep back to Running with the database login still working on the same generated password; (3) the pinned MySQL honours `MYSQL_ROOT_PASSWORD_FILE`, shown by Keep's database migrations completing and a login to the database with the generated password working and an empty password refused.
  spec_checkpoint: true
  done_checkpoint: true
