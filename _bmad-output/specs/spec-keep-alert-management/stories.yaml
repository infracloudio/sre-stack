- id: "8"
  title: "Lower priority: Grafana alerts also reach Keep"
  description: |-
    Priority: LOWER, after the main nine. Size: 1 to 2 days. Needs: story 3 (in practice after 6a, so the real key is checked). AD numbers: AD-012 (rule 3, which now says Grafana also reads the key Secret), AD-008 (rule 4), AD-009 (rules 2 and 3). Capability: CAP-9.

    Problem: Keep only hears from Prometheus rules through Alertmanager. Grafana's own alerts, which many teams use, go nowhere, so a fault seen in Grafana never joins an incident.

    Outcome: On AKS, Grafana has a webhook contact point that posts to Keep at `/alerts/event/grafana`, and a notification policy that forwards alerts to it. For Grafana newer than 9.4.7 Keep's own setup uses the contact point's `authorization_scheme` `digest` with `authorization_credentials` set to the key (Keep `grafana_provider.py:574-581`, commit e5cd8698), and Keep accepts the Digest scheme (`keep/identitymanager/authverifierbase.py:320`); this replaces the `X-API-KEY` header that research.md mentions. kube-prometheus-stack 52.0.0 ships Grafana chart 6.60.* (Grafana 10). Grafana reads the existing Secret `alertmanager-keep-auth` (same `monitoring` namespace, same `prometheus-stack` release) through an environment variable used by its provisioning file; the settings go in `infra/azure/chart-values/prometheus-stack.yaml`, where one target owns the release (AD-012). There is no new copy of the key. A sample Grafana alert rule, kept as a file in the repo, uses a condition no Prometheus rule covers (noted in `plan.md`) and carries one of the four severities Keep's Grafana map knows: critical, high, warning or info (`grafana_provider.py:120-125`; anything else becomes info, `:413`). When it fires it appears in Keep with that severity and resolves when it clears.

    Out of scope: changing the correlation rule so Grafana alerts join the robot-shop incident (a separate decision). Replacing or removing Alertmanager. Moving the repo's Prometheus rules into Grafana. Dashboards. Slack from Grafana. EKS and k3d. A new decision (AD) is added only if the builder finds Grafana 10 cannot read the Secret this way.

    Must keep working (AGENTS.md): Grafana at `/grafana`, its admin login and its dashboards. Story 3's Alertmanager path to Keep and the whole main chain. `make setup-aks` without Keep secrets still finishes. `make setup-local` and EKS untouched. `make lint` passes, including its secrets check.

    Live checks: (1) the contact point delivers: a test notification from Grafana reaches Keep and is accepted with the real key and refused with a wrong one (the login is on by then); (2) severity: the sample alert shows in Keep with the severity set on it, one of the four above, not as info; (3) no secret: `helm get values` and `helm get manifest` for `prometheus-stack` show no key value, and the Secret that holds it is not named `keep-*`; (4) a changed key file, after a re-run of the targets involved, still delivers, and Grafana is restarted after the key change because environment variables are read at start (AD-008 rule 4); (5) nothing was tried before: the live Grafana version is confirmed and the contact point and policy provisioning with the digest scheme is checked on it, and the result is written into `plan.md`.
  spec_checkpoint: true
