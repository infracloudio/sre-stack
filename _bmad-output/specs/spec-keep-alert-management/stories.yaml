- id: "1"
  title: Add alert rules for robot-shop
  description: |-
    Priority: main. Size: 1 to 2 days. Comes after: nothing. Capability: CAP-2.

    In one line: add Prometheus alert rules for robot-shop, so a fault raises alerts.

    Problem
    - Robot-shop has no alert rules today. When a fault happens, no alert fires.
    - Without alerts, Keep and Slack have nothing to react to.

    Outcome
    - The rules are in `infra/azure/alert-rules/robot-shop.yaml`. It is a PrometheusRule (a Prometheus Operator object that holds alert rules) with the label `release: prometheus-stack`.
    - The rules are applied with `kubectl apply` from the AKS part of the monitoring setup, in the same way as `infra/azure/dashboards/` (makefile line 167). They apply to AKS only, so k3d and EKS do not change.
    - Why this way: it is the same pattern as `infra/azure/dashboards` and scenario-02. Changing a threshold is one `kubectl apply`, not a `helm upgrade` of `prometheus-stack`.
    - There is one rule each for OOM kills (a container stopped for using too much memory), container restarts, unavailable replicas, slow requests and a high share of 5xx (server error) responses.
    - Every alert has a severity that Keep understands (critical, error, high, warning or info) and the labels `namespace` and `service`.
    - During the cart OOM fault, with the load generator running, the OOM kill, restart, unavailable-replica and 5xx alerts show as firing on the Prometheus Alerts page.
    - The slow-request alert fires only if latency goes over the tuned payment threshold. The tuned value and the reason for it are written down.
    - With the load generator running and no fault, nothing fires for 30 minutes.
    - Deleting the AKS cluster (`make cleanup`) removes the rules. A `helm uninstall` alone would not, because the rules are applied with `kubectl`.

    Out of scope
    - Alertmanager and Keep (stories 2 and 3).
    - Rules for hotrod, Grafana alerts, dashboards.
    - The unused Bookinfo rule in `monitoring/chart-values/prometheus-values.yaml` (`additionalPrometheusRulesMap`). It is in the shared values that k3d and EKS use. Log it as a follow-up and do not touch it here.

    Must keep working
    - `make setup-local` and the EKS path.
    - Prometheus, Grafana and Beyla.
    - The cart OOM scenario start and revert.
    - `make lint`.

    Decisions followed: none of AD-008 to AD-013 apply.

    Live checks on AKS
    - The 30-minute quiet run under load.
    - The fault run.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Builder note: start from `tryout/`, read research.md section 5, run
    `make lint` and paste its output. No secrets in tracked files. Prove
    it live on AKS before calling it done. Never print or paste a
    secret value. Stop the AKS cluster (`az aks stop`) when the session
    ends unless told otherwise. Author and approver must be different
    people. One pull request, squash-merged.
- id: "2"
  title: Install Keep on AKS with make setup-keep
  description: |-
    Priority: main. Size: 1 to 2 days. Comes after: nothing (can run at the same time as story 1). Capability: CAP-1.

    In one line: add one command, `make setup-keep`, that installs Keep on AKS safely.

    Problem
    - There is no Keep in the stack yet.
    - The Keep Helm chart defaults are not safe for us. They send usage data out, leave some images unpinned (`latest`), run MySQL with no root password and store the database on a hostPath volume.

    Outcome
    - `make setup-keep` on AKS brings four pods to Running: backend, frontend, websocket server and MySQL. They run on the `workload=o11y` node pool.
    - The database volume is on `gp2`. Telemetry is off. Every chart image is pinned to an exact version.
    - All Helm values are in `infra/azure/chart-values/keep.yaml`. The scripts are in `infra/azure/keep/`. The chart is `keephq/keep` 0.1.97.
    - The Fireworks key is read from the untracked secrets folder and reaches Keep as the Kubernetes Secret `sre-keep-ai-env`. `OPENAI_MODEL_NAME` is set on backend and frontend.
    - The database root password is generated once into the folder and reaches Keep as the Secret `sre-keep-db`.
    - No Secret of ours has a name that starts with `keep-` (the chart's uninstall hook deletes those).
    - A second run changes nothing and restarts nothing.
    - Run on its own with `fireworks.key` missing, `make setup-keep` stops before it touches the cluster and names the missing file.
    - Run inside `make setup-aks` with that file missing, it skips Keep with a message and the rest of setup finishes.
    - The Keep UI opens through `kubectl port-forward`. There is no login yet (story 6a adds it).

    Out of scope
    - Alertmanager, API keys, the correlation rule, Slack and Fireworks providers, workflows, the login and the gateway route (stories 3 to 6b).
    - Any Keep install on k3d or EKS.

    Must keep working
    - `make setup-local` and the EKS path.
    - `make setup-aks` without Keep secrets.
    - Other pods on the o11y pool still schedule.
    - `make lint`, including Helm lint of the new values file.
    - AKS `make cleanup` (it deletes the cluster, so everything goes with it).

    Decisions followed: AD-008 (secrets), AD-013 (install baseline), AD-011 (file layout), AD-003 (node pool and tolerations).

    Live checks on AKS
    - Image pins (AD-013): the exact tag chosen for MySQL, the uninstall hook image and busybox is written in `plan.md`, and the pod runs on it.
    - Hook image: it has a shell with `grep`, `xargs` and kubectl. Show it with a real `helm uninstall keep` that removes the `keep-*` Secrets without error.
    - Naming rule: after `helm uninstall keep`, the Secrets `sre-keep-ai-env` and `sre-keep-db` still exist. A second `make setup-keep` brings Keep back to Running, and the database login still works with the same generated password.
    - MySQL: the pinned image honours `MYSQL_ROOT_PASSWORD_FILE`. Show that Keep's database migrations finish, a login with the generated password works, and an empty password is refused.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Builder note: start from `tryout/`, read research.md section 5, run
    `make lint` and paste its output. No secrets in tracked files. Prove
    it live on AKS before calling it done. Never print or paste a
    secret value. Stop the AKS cluster (`az aks stop`) when the session
    ends unless told otherwise. Author and approver must be different
    people. One pull request, squash-merged.
- id: "3"
  title: Send Alertmanager alerts to Keep (AKS only)
  description: |-
    Priority: main. Size: 1 to 2 days. Comes after: stories 1 and 2. Capability: CAP-3.

    In one line: turn Alertmanager on for AKS and make Keep its only receiver.

    Problem
    - Alertmanager is off today. Its Slack setting in the shared values file is a placeholder that never worked.
    - Even with rules (story 1) and Keep (story 2), no alert reaches Keep.

    Outcome
    - On AKS, Alertmanager runs and sends firing and resolved alerts only to Keep: `http://keep-backend.keep.svc.cluster.local:8080/alerts/event/prometheus`. The settings are in `infra/azure/chart-values/prometheus-stack.yaml` (AD-012).
    - The header comment of that AKS file says the shared file was edited, which departs from specs/005 (AD-012 rule 4).
    - The broken Slack setting, the `P1 -> slack` route and the `slack` receiver are removed from `monitoring/chart-values/prometheus-values.yaml`. That file keeps `alertmanager.enabled: false`, so k3d and EKS still run no Alertmanager.
    - Keep creates a `webhook` API key at start-up from the generated file `keep-webhook-api.key`, through the Secret `sre-keep-api-keys` (`KEEP_DEFAULT_API_KEYS`). The key's name includes a fingerprint of its value.
    - Alertmanager sends that key from the Secret `alertmanager-keep-auth` in the `monitoring` namespace. `setup-aks-prometheus-stack` creates this Secret before its `helm upgrade`, so the Alertmanager pod always starts.
    - A test alert reaches Keep within one minute and shows as resolved after it clears.
    - During the cart OOM fault, the alerts from story 1 appear in Keep and resolve after `make aks-cart-oom-revert`.

    Out of scope
    - The `admin` setup key (story 4).
    - The login and the real key checks (story 6a). Keep has no login until then and accepts any key.
    - Slack and Fireworks (story 5a), Grafana alerts, any second receiver.

    Must keep working
    - EKS and k3d render exactly as before. The `helm template` output of the shared values alone is the same before and after the edit.
    - `make setup-aks` without Keep secrets. (Alertmanager then runs and logs failed deliveries. AD-012 accepts that.)
    - `setup-keep` never upgrades the `prometheus-stack` release.
    - `make lint`.

    Decisions followed: AD-012 (Alertmanager), AD-009 rules 2 and 3 (API keys), AD-008 rules 2 and 4 (Secrets and restarts).

    Live checks on AKS
    - Because Keep has no login here, it accepts any key, so "the key is accepted" proves nothing. Compare what exists instead, and never print a secret value.
    - Key check: the seeded key is listed in Keep's API key list under its fingerprint name, and `alertmanager-keep-auth` holds the same value as `keep-webhook-api.key` (compare hashes). If seeding does not work, fall back to `POST /settings/apikey` and say so in `plan.md`.
    - Render check: paste the before-and-after `helm template` comparison of the shared values file into the pull request.
    - Key change check (the cut point if the story runs long): change the key file and re-run `setup-aks-prometheus-stack` and `make setup-keep`. The Secrets match the file and Keep lists the new fingerprint-named key. `plan.md` says who restarts `keep-backend`: `setup-keep`, when the Secret changed, because Keep reads `KEEP_DEFAULT_API_KEYS` only at pod start (AD-008 rule 4). Alertmanager's mounted file updates by itself.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Builder note: start from `tryout/`, read research.md section 5, run
    `make lint` and paste its output. No secrets in tracked files. Prove
    it live on AKS before calling it done. Never print or paste a
    secret value. Stop the AKS cluster (`az aks stop`) when the session
    ends unless told otherwise. Author and approver must be different
    people. One pull request, squash-merged.
- id: "4"
  title: Group the alerts of one fault into one incident
  description: |-
    Priority: main. Size: 1 to 2 days. Comes after: story 3. Capabilities: CAP-4, CAP-7 (the rule part).

    In one line: create a Keep correlation rule (a rule that groups alerts into one incident) from a file in the repo, with a script that is safe to run again.

    Problem
    - Keep now receives the alerts (story 3) but shows them one by one.
    - One fault raises five alerts. Nothing groups them into one incident.

    Outcome
    - The file `infra/azure/keep/correlation-rule.json` holds the rule in the shape `POST /rules` takes. The values come from the try-out (research.md section 5):
      - CEL (Keep's rule language) `namespace == "robot-shop"`, with an `sqlQuery` object next to the `celQuery`. The API refuses the rule without it.
      - `groupingCriteria` is `[namespace]`.
      - Time window is 600 seconds, and the incident opens at 3 alerts (`createOn` any).
      - `resolveOn` is all resolved.
    - `make setup-keep` creates the rule through the backend API. It opens `kubectl port-forward svc/keep-backend` on a free port chosen by kubectl, closes it on exit, and sends the `admin` key.
    - It lists the rules and matches by rule name. Absent: create the rule. Present and different: update it in place with `PUT /rules/{rule_id}`. Identical: do nothing.
    - "Different" means the fields in `correlation-rule.json` differ from the same fields in the `GET /rules` response. Do not compare the whole response. It adds an id, timestamps, an author and its own SQL form, and it may name the rule `name` instead of `ruleName`. The builder records the request-to-response field mapping in `plan.md` from one live `GET`.
    - Keep creates the `admin` key from the generated `setup-api.key`. It is added to `sre-keep-api-keys` next to story 3's key, under its own fingerprint name.
    - If the backend is not reachable, `setup-keep` stops with a message.
    - One cart OOM fault (load generator running) gives exactly one incident in Keep. It closes by itself after `make aks-cart-oom-revert` and after its last alert clears.
    - Running `make setup-keep` again leaves exactly one rule.

    Out of scope
    - Slack and Fireworks (stories 5a and 5b), the login (story 6a).
    - Keep's own limits: a resolved incident's `end_time` stays empty, and the UI labels rule-grouped alerts "Manually".
    - Rules for hotrod, any other correlation rule.

    Must keep working
    - Stories 2 and 3 as built. `setup-keep` stays idempotent (a second run changes nothing). Alertmanager still delivers.
    - `make setup-aks` without Keep secrets. The rule script runs only when Keep is installed.
    - EKS and k3d.
    - `make lint`, including shell lint of the new script.

    Decisions followed: AD-011 rules 1, 4 and 5 (configuration as files, the rule by API), AD-009 rules 2 and 3 (API keys), AD-008 rule 2 (Secrets).

    Live checks on AKS
    - The seeded `setup` key is listed in Keep under its fingerprint name. Keep has no login in this story, so this shows the key exists, not that the login accepts it. Story 6a proves the second part.
    - Update path: change one field in `correlation-rule.json` (for example the window) and re-run `make setup-keep`. The same rule id changes, and the rule count stays one.
    - A re-run with an unchanged file makes no write. This depends on the field comparison above.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Builder note: start from `tryout/`, read research.md section 5, run
    `make lint` and paste its output. No secrets in tracked files. Prove
    it live on AKS before calling it done. Never print or paste a
    secret value. Stop the AKS cluster (`az aks stop`) when the session
    ends unless told otherwise. Author and approver must be different
    people. One pull request, squash-merged.
- id: "5a"
  title: Post an AI summary to Slack when an incident opens
  description: |-
    Priority: main. Size: 1 to 2 days. Comes after: story 4. Capabilities: CAP-5 (opened message), CAP-7 (providers and first workflow).

    In one line: when Keep opens an incident, a Keep workflow asks Fireworks for a summary and posts it to Slack.

    Problem
    - Keep now opens one incident per fault, but nobody is told.
    - In the try-out the summary worked, but only with provider setup done by hand and a workflow pasted in by hand. A reinstall loses both.

    Outcome
    - `infra/azure/keep/providers.template.json` holds every non-secret provider field.
    - `make setup-keep` fills in the Fireworks key and the Slack webhook URL from the untracked secrets folder with `jq`. It writes the result as `KEEP_PROVIDERS` into the Secret `sre-keep-providers`, loaded through `backend.envFromSecrets`.
    - The providers have fixed names: `fireworks` (type `litellm`, `api_url` `https://api.fireworks.ai/inference/v1`) and `slack`.
    - `infra/azure/keep/workflows/` holds the opened-incident workflow as a Keep workflow file. It starts from the try-out file `notify-slack-with-context.yaml`:
      - model `accounts/fireworks/models/glm-5p3-flash`, `max_tokens` 10000;
      - then a Slack post with the summary, the severity, the alert count and an "Open in Keep" link to `http://keep.demo.local/incidents/<id>`.
    - The workflow uses the two fixed provider names, not the try-out name `keep-alerts-srestack`.
    - `setup-keep` loads the folder into the ConfigMap `sre-keep-workflows`, mounts it and sets `KEEP_WORKFLOWS_DIRECTORY`.
    - Keep reads `KEEP_PROVIDERS` and the workflows only at backend start. So `setup-keep` restarts `keep-backend` when the `sre-keep-providers` content or the workflows folder changes, decided by a hash. A run with nothing changed restarts nothing.
    - `slack-webhook.url` is now a required file, next to `fireworks.key`. Run on its own, `setup-keep` stops and names a missing file. Inside `make setup-aks` it skips Keep with a message that lists the missing files. The README or `plan.md` says that `slack-webhook.url` is now required.
    - During the cart OOM fault, Slack shows a Fireworks summary within two minutes of the incident opening. It names the failing service and says what to check first.
    - After `helm uninstall keep` and `make setup-keep`, the providers and the workflow are back with no manual step.
    - No secret value is in any repo file, values file or ConfigMap.

    Out of scope
    - The resolved message (story 5b).
    - The login and the gateway route (stories 6a and 6b). The "Open in Keep" link works only after story 6b.
    - Jira, PagerDuty, automatic remediation, Grafana or Tempo links in the message, the AI Summary button.

    Must keep working
    - Stories 2 to 4 as built, including one incident per fault and Alertmanager delivery.
    - `setup-keep` stays idempotent.
    - `make setup-aks` without Keep secrets.
    - `make setup-local` and EKS.
    - `make lint`, including its secrets check.

    Decisions followed: AD-011 rules 2 and 3 (workflows and providers), AD-008 rules 1, 2, 4 and 5 (secrets), AD-010 rule 2 (the link), AD-013 rule 2 (env lists).

    Live checks on AKS
    - The Fireworks reply is not empty with `max_tokens` 10000 on a real incident. The model thinks first, so a small budget returns nothing (SPEC, research.md section 5).
    - After `helm uninstall keep`, the Secret `sre-keep-providers` still exists. After the next `make setup-keep`, both providers and the workflow are present, and the next OOM fault posts a summary.
    - Write down in `plan.md` what start-up provisioning does (AD-011 rule 2 says this is not a gate): the workflow loads from the mounted ConfigMap, the ConfigMap's `..data` entries are ignored, and a deleted workflow file is gone after the next backend restart.
    - Search the tracked files, the rendered ConfigMap, the output of `helm get values keep` and the output of `helm get manifest keep`. None may contain the Fireworks key or the Slack webhook URL.
    - Change `slack-webhook.url` (for example to a second test webhook) and re-run `make setup-keep`. The next message arrives on the new webhook.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Builder note: start from `tryout/`, read research.md section 5, run
    `make lint` and paste its output. No secrets in tracked files. Prove
    it live on AKS before calling it done. Never print or paste a
    secret value. Stop the AKS cluster (`az aks stop`) when the session
    ends unless told otherwise. Author and approver must be different
    people. One pull request, squash-merged.
- id: "5b"
  title: Post one message to Slack when the incident resolves
  description: |-
    Priority: main. Size: 1 to 2 days. Comes after: story 5a. Capabilities: CAP-5 (resolved message), CAP-7 (second workflow).

    In one line: add a second Keep workflow that posts exactly one message to Slack when an incident resolves.

    Problem
    - Slack hears when an incident opens (story 5a) but never when it closes. The channel looks like the fault never ends.
    - Keep has no "incident resolved" trigger. It has only created, updated and deleted. The try-out never tried the updated trigger.

    Outcome
    - `infra/azure/keep/workflows/` has a second workflow file, separate from story 5a's. It runs on incident updated.
    - Incident triggers take only a list of events, with no condition or filter (Keep `keep/workflowmanager/workflowmanager.py:147-154`, commit e5cd8698). So the condition "status is resolved" goes on the Slack action as an `if:`, not on the trigger.
    - The rules engine sends "updated" for every alert event added to a visible incident (`keep/rulesengine/rulesengine.py:206-208`). A condition on status alone can therefore post more than once.
    - So the story follows Keep's own pattern in `examples/workflows/incident-tier-escalation.yml`. The action's `if:` checks that the status is resolved and that a marker (for example `resolved_notified`) is not set. The action then sets the marker with `enrich_incident`. Keep loads incident enrichments before each run (`workflowmanager.py:159-162`).
    - The action posts one short message to the same Slack channel through the `slack` provider: the incident name, that it resolved, and the "Open in Keep" link. It makes no summary call.
    - After `make aks-cart-oom-revert`, once the last alert clears and Keep resolves the incident, exactly one resolved message appears in Slack, not one per update.
    - In the try-out the incident resolved about 8 minutes after the revert (research.md section 5). The check waits that long and then counts messages for 10 more minutes.
    - After the live run, `plan.md` records two known limits. First: whether two near-simultaneous updates can both post (the 10-minute count shows it). Second: a resolved incident that reopens keeps the marker, so its second close posts nothing. This is accepted for the demo. If needed, it becomes a follow-up story.

    Out of scope
    - Any change to the opened-incident workflow.
    - A new summary at resolve time.
    - Keep's `end_time` or time-to-resolve.
    - A message when an incident is deleted.

    Must keep working
    - Story 5a's opened-incident message and its workflow file, unchanged.
    - One incident per fault (story 4).
    - `setup-keep` stays idempotent and restarts nothing when the workflows folder is unchanged (the hash rule from story 5a).
    - `make setup-aks` without Keep secrets.
    - `make lint`.

    Decisions followed: AD-011 rule 2 (workflows as files).

    Live checks on AKS
    - Start with the thing the try-out never ran. Does a workflow on incident updated, with the `if:` on status resolved and the marker, fire when an incident resolves? How many times does it fire over the next ten minutes? Record the count, and how the workflow was made to fire once, in `plan.md`.
    - The opened-incident workflow does not send a second summary when the incident is updated or resolved. The resolved workflow does not fire while the incident is still open.
    - Final proof: the exactly-once count above, on a real fault and revert.
    - Stop rule: if no condition can make the message fire exactly once, stop and return to the spec. Do not ship a version that posts more than once.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Builder note: start from `tryout/`, read research.md section 5, run
    `make lint` and paste its output. No secrets in tracked files. Prove
    it live on AKS before calling it done. Never print or paste a
    secret value. Stop the AKS cluster (`az aks stop`) when the session
    ends unless told otherwise. Author and approver must be different
    people. One pull request, squash-merged.
- id: "6a"
  title: Turn on the Keep login and check the API keys
  description: |-
    Priority: main. Size: 1 to 2 days. Comes after: stories 3, 4 and 5b. Capability: CAP-6 (login part).

    In one line: switch Keep from "no login" to a real login, and prove that the API keys are checked.

    Problem
    - Keep runs in `NOAUTH` mode. In that mode every request with any API key counts as admin. Keep cannot be reachable from outside the cluster in that mode (AD-009).
    - So far no story has proven that Alertmanager's key or the setup key is really checked.

    Outcome
    - Keep requires a login. `AUTH_TYPE=DB` (uppercase) is set on backend and frontend.
    - One default user exists. Its name comes from `.env` (`KEEP_DEFAULT_USERNAME`). Its password, `KEEP_JWT_SECRET` and `NEXTAUTH_SECRET` come from the new Secret `sre-keep-auth`. `setup-keep` builds it from the generated files `login-password`, `jwt-secret` and `nextauth-secret` in the secrets folder. It is wired through `backend.envFromSecrets` and `frontend.envFromSecrets`.
    - `KEEP_FORCE_RESET_DEFAULT_PASSWORD=true` makes `login-password` the source of truth on every start.
    - The login password is never printed. The operator reads it from the file.
    - `NEXTAUTH_URL` keeps the chart default `http://localhost:3000` in this story. Sign-in goes through `kubectl port-forward`, and the route to `keep.demo.local` does not exist yet. Story 6b sets it to `http://keep.demo.local` (AD-009 rule 1).
    - The login page opens through `kubectl port-forward`. The default user signs in. New alerts show after a page refresh. (Live updates need the websocket route of story 6b. Through a port-forward the try-out's websocket fails.)
    - A request with a made-up API key is rejected.
    - Alertmanager still delivers with its real key.
    - The rule, providers and workflows from stories 4 to 5b still work with the login on.

    Out of scope
    - The gateway route and `keep.demo.local`, and live updates without a refresh (story 6b).
    - Single sign-on, roles, more users, TLS.
    - Changing the password in Keep's UI (a restart resets it, AD-009).
    - README work (story 7).

    Must keep working
    - The whole chain so far: one cart OOM fault still ends in one incident, a Slack summary and one resolved message.
    - `setup-keep` stays idempotent, and a second run restarts nothing.
    - `make setup-aks` without Keep secrets.
    - `make setup-local` and EKS.
    - `make lint`, including its secrets check.

    Decisions followed: AD-009 rules 1 to 4 (login and API keys), AD-008 rules 1 to 4 (secrets), AD-013 rule 2 (env lists).

    Live checks on AKS
    - Login: the default user signs in with `login-password` through the port-forward. The try-out never ran this.
    - Password change: after you change `login-password` and re-run `make setup-keep`, the new value signs in and the old one is refused (AD-009 rule 1).
    - Key checks (moved here from stories 3 and 4, because `NOAUTH` accepted anything):
      - Alertmanager's deliveries return 202 with the right key and 401 with a wrong one.
      - A made-up key is rejected.
      - `setup-keep`'s admin key still creates and updates the correlation rule with the login on (AD-009 rule 3).
    - Key change (the cut point if the story runs long): after a key-file change and a re-run of `setup-aks-prometheus-stack` and `make setup-keep`, deliveries still return 202 with the new value (AD-008 rule 4).
    - If seeding does not work, the fallback is `POST /settings/apikey`. If that fails too, stop and return to the spec (AD-009 rule 4).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Builder note: start from `tryout/`, read research.md section 5, run
    `make lint` and paste its output. No secrets in tracked files. Prove
    it live on AKS before calling it done. Never print or paste a
    secret value. Stop the AKS cluster (`az aks stop`) when the session
    ends unless told otherwise. Author and approver must be different
    people. One pull request, squash-merged.
- id: "6b"
  title: Give Keep its own address, keep.demo.local
  description: |-
    Priority: main. Size: 1 to 2 days. Comes after: story 6a. Capability: CAP-6 (address and live updates).

    In one line: serve the Keep UI and its websocket at `http://keep.demo.local` through the Istio gateway.

    Problem
    - The Keep UI opens only through `kubectl port-forward`. There its live updates fail: the browser tries `ws://localhost:3000/websocket` and `wss://localhost/websocket`, and both fail (try-out findings).
    - A presenter has no address to open, and the "Open in Keep" link in Slack goes nowhere.

    Outcome
    - The file `infra/azure/keep/istio-gateway.yaml` holds a Gateway and a VirtualService in the `keep` namespace. They are host-matched on the shared `istio: ingressgateway`. It has the same file name as HotROD's `app/hotrod/istio-gateway.yaml` (applied at makefile line 345), but it sits in the AKS-only folder that AD-011 gives Keep.
    - One VirtualService sends `/websocket/app/` to `keep-websocket:6001`, with the prefix rewritten to `/app/`. Everything else goes to `keep-frontend:3000`. The backend gets no route.
    - `NEXTAUTH_URL` in `frontend.env` becomes `http://keep.demo.local`, in the same pull request as the route (AD-009 rule 1).
