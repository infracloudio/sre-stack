    - The log alert fires during the fault and reaches Keep with its set severity, not as info (Keep reads `labels.severity`, research.md).
    - Compare the log alert's labels with the correlation rule on a real fault. Record whether it joins the one incident or opens a second.
    - No secret: `helm get values` and `helm get manifest` for `loki` and `prometheus-stack` show no key value.
