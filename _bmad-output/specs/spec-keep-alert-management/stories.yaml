- id: "11"
  title: "Lower priority: find why the Keep 'AI Summary' button fails with this model"
  description: |-
    Priority: LOWER, after the main nine. Size: 1 to 2 days, time-boxed to two days. Needs: story 2 (in practice after 5a, which brings the Fireworks provider). AD numbers: none. Capability: CAP-12.

    Problem: In the try-out, Keep's "AI Summary" button ran for about 40 seconds and saved nothing, and "record root cause" saved empty entries (tool calls arrived with empty arguments, for example `rca_points` `[{},{},{}]`). The epic gets its summary from a workflow instead (story 5a), so the button is unexplained and nobody knows whether it can work with Fireworks and GLM-5.3 Flash. The button is open-source UI code, not the enterprise tier. `keep-ui/app/(keep)/incidents/[id]/incident-overview.tsx:85-110` runs a CopilotTask that asks the model to call the tool `setGeneratedSummary(summary)`, whose handler saves `user_summary` through `updateIncident`. The request goes to the frontend's own route `keep-ui/app/api/copilotkit/route.ts:9-25` (CopilotKit `OpenAIAdapter`, `OPEN_AI_API_KEY`, `OPENAI_MODEL_NAME`, base URL from the OpenAI client's environment) and then to Fireworks; Keep's backend is not involved (Keep commit e5cd8698). The CopilotKit runtime is `^1.8.11` (`keep-ui/package.json:24`).

    Outcome: A written finding with the cause and a minimal repro, in `research.md` for this story's folder under `specs/`, with the evidence (the browser's request and the frontend log lines, with no secret values). The finding names where the request goes, whether it reaches Fireworks, what comes back, and why nothing is saved. Because this repo runs upstream images, a fix can only be configuration. Using a different model for the button would break the one-model decision (SPEC): stop and ask, do not decide inside the story. Otherwise the outcome is the finding, the repro, and an upstream issue drafted for Keep or CopilotKit, filed only with explicit approval.

    Out of scope: turning on the enterprise tier. Another AI provider or another model. Building a replacement button. Changes to the 5a or 5b workflows. EKS and k3d.

    Must keep working (AGENTS.md): the main chain: one incident, the Slack summary, one resolved message. `EE_ENABLED` stays unset. `setup-keep` stays idempotent. `make setup-aks` without Keep secrets still finishes. `make lint` passes, including its secrets check.

    Live checks: (1) first, with no cluster needed: the same tool call as the button's, sent to Fireworks with `stream: true`, recording whether the argument deltas arrive (the try-out's non-streaming `curl` tool call worked); (2) the failure is reproduced on a live incident, with the time it takes and what the page shows; (3) the frontend log and the browser's request for the button are read and the result written down with no secret value; (4) the setting names the route reads (the model and key variables from `sre-keep-ai-env`) are listed with whether each is set, without printing their values; (5) the time box is two days: if the cause is not found by then, the finding records what was ruled out and the story ends.
