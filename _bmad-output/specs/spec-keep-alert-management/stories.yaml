- id: "11"
  title: "Lower priority: find why the AI Summary button fails"
  description: |-
    Priority: LOWER, after the nine main stories. Size: 1 to 2 days, time-boxed to two days. Comes after: story 2 (in practice after story 5a, which brings the Fireworks provider). Capability: CAP-12.

    In one line: find out why Keep's "AI Summary" button fails with this model, and write it down.

    Problem
    - In the try-out the button ran for about 40 seconds and saved nothing. "Record root cause" saved empty entries. The tool calls arrived with empty arguments (for example `rca_points` `[{},{},{}]`).
    - The epic gets its summary from a workflow (story 5a). The button is unexplained, and nobody knows whether it can work with Fireworks and GLM-5.3 Flash.
    - The button is open-source UI code, not the enterprise tier. `keep-ui/app/(keep)/incidents/[id]/incident-overview.tsx:85-110` runs a CopilotTask that asks the model to call the tool `setGeneratedSummary(summary)`. Its handler saves `user_summary` through `updateIncident`.
    - The request goes to the frontend's own route `keep-ui/app/api/copilotkit/route.ts:9-25` (CopilotKit `OpenAIAdapter`, `OPEN_AI_API_KEY`, `OPENAI_MODEL_NAME`, base URL from the OpenAI client's environment). From there it goes to Fireworks. Keep's backend is not involved (Keep commit e5cd8698). The CopilotKit runtime is `^1.8.11` (`keep-ui/package.json:24`).

    Outcome
    - A written finding exists with the cause and a minimal repro. It is in `research.md` for this story's folder under `specs/`, with the evidence (the browser's request and the frontend log lines, with no secret values).
    - The finding says where the request goes, whether it reaches Fireworks, what comes back, and why nothing is saved.
    - The repo runs upstream images, so a fix can only be configuration. Using a different model for the button would break the one-model decision (SPEC). In that case stop and ask. Do not decide inside the story.
    - Otherwise the outcome is the finding, the repro, and an upstream issue drafted for Keep or CopilotKit. File it only with explicit approval.

    Out of scope
    - Turning on the enterprise tier, another AI provider or model, a replacement button.
    - Changes to the workflows of stories 5a and 5b. EKS and k3d.

    Must keep working
    - The main chain: one incident, the Slack summary, one resolved message.
    - `EE_ENABLED` stays unset.
    - `setup-keep` stays idempotent.
    - `make setup-aks` without Keep secrets.
    - `make lint`, including its secrets check.

    Decisions followed: none.

    Live checks
    - First, with no cluster needed: send the same tool call as the button to Fireworks with `stream: true`, and record whether the argument deltas arrive. (The try-out's non-streaming `curl` tool call worked.)
    - Reproduce the failure on a live incident. Record how long it takes and what the page shows.
    - Read the frontend log and the browser's request for the button. Write the result down with no secret value.
    - List the setting names the route reads (the model and key variables from `sre-keep-ai-env`) and whether each is set, without printing their values.
    - The time box is two days. If the cause is not found by then, the finding records what was ruled out and the story ends.
