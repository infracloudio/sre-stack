- id: "10"
  title: "Lower priority: send Loki log alerts to Keep"
  description: |-
    Priority: LOWER, after the nine main stories. Size: 1 to 2 days. Comes after: story 3 (in practice after story 6a, so the real key is checked). Capability: CAP-11.

    In one line: add an alert rule on Loki logs that reaches Keep through Alertmanager.

    Problem
    - Some faults show up first in the logs, such as an OOM kill, an error message or a crash loop.
    - Keep hears only about metrics today. A log-based alert adds that signal to the same incident.

    Outcome
    - At least one alert rule on Loki logs is kept as a file in the repo, next to story 1's rules, in `infra/azure/alert-rules/`. It sets `namespace` to `robot-shop` and a `severity` label explicitly.
    - The route uses what is already in place, with no new key and no new Secret. Loki's built-in ruler (`ruler.enabled` is true by default in the pinned chart `grafana-community/loki` 18.13.7, makefile line 218) sends alerts to the existing Alertmanager through `loki.rulerConfig` (`alertmanager_url`). Alertmanager already sends to Keep (story 3).
    - The chart's rules sidecar is on by default (`sidecar.rules.enabled: true`) and loads ConfigMaps labelled `loki_rule`. So the rule reaches Loki as such a ConfigMap.
    - The alert fires during the cart OOM fault and appears in Keep. Its severity comes from the Prometheus provider's list (critical, error, high, warning or info, as in story 1). It has `namespace` and `service` labels. It resolves when it clears.

    Out of scope
    - Changing the correlation rule so the log alert joins the robot-shop incident, unless the live check shows it must.
    - Moving metric rules into Loki, dashboards, Slack changes, EKS and k3d.
    - A Grafana-managed alert on a Loki query. Drop this unless the ruler route fails live.

    Must keep working
    - Loki's log intake and the Grafana log views.
    - Story 3's Alertmanager path.
    - One cart OOM fault still produces exactly one incident and one resolved message, unless the story proves otherwise and says so in `plan.md`.
    - `make setup-aks` without Keep secrets.
    - `make setup-local` and EKS.
    - `make lint`, including its secrets check.

    Decisions followed: AD-012 (Alertmanager is the one receiver, set up in story 3). No new key.

    Live checks on AKS
