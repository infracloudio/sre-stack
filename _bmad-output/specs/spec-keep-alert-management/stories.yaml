- id: "9"
  title: "Lower priority: add Kubernetes events to the AI summary"
  description: |-
    Priority: LOWER, after the nine main stories. Size: 1 to 2 days. Comes after: story 5a (in practice after story 7). Capability: CAP-10.

    In one line: let the Slack summary use Kubernetes events, so it can say why a container restarted.

    Problem
    - Prometheus shows that a container restarted. Kubernetes events say why (for example `OOMKilled`, `BackOff`).
    - The Slack summary is written from the alerts alone, so it often cannot name the reason.
    - Keep cannot take Kubernetes events in as alerts. Its `kubernetes` provider (`keep/providers/kubernetes_provider/kubernetes_provider.py`, commit e5cd8698) has no alert intake or webhook. It is a query provider with commands such as `get_events` for a namespace or a pod (lines 150, 170, 332-360), and it can use in-cluster credentials (`use_in_cluster_config`, lines 46 and 109). No event exporter appears in Keep's code or docs.

    Outcome
    - The opened-incident workflow (story 5a) has a new step. It calls `get_events` for the `robot-shop` namespace through a Keep `kubernetes` provider, and passes the result into the Fireworks prompt.
    - The provider uses the cluster's own credentials, is added to `providers.template.json`, and holds no secret.
    - A Role and a RoleBinding let the service account `keep` in the `keep` namespace get and list events in `robot-shop` only. (The chart renders `serviceAccountName: keep` on all Keep pods. It is already bound to the chart's own Role `secret-manager-role`.) The Role and the binding live in `robot-shop`.
    - During the cart OOM fault, the Slack summary names the OOM kill or the back-off, taken from those events.

    Out of scope
    - Events as alerts in Keep (Keep cannot take them in), any event exporter, other namespaces.
    - The resolved workflow. This story changes the opened workflow only.

    Must keep working
    - One cart OOM fault still produces exactly one incident and one resolved message (events never become alerts).
    - Story 5a's Slack message and link.
    - `setup-keep` stays idempotent and restarts nothing when nothing changed.
    - `make setup-aks` without Keep secrets.
    - EKS and k3d.
    - `make lint`, including its secrets check.

    Decisions followed: AD-011 (providers and workflows as files). No new decision.

    Live checks on AKS
    - The provider and the access rule work in the cluster: events for `robot-shop` come back, events from another namespace are refused.
    - During the cart OOM fault, the Slack summary names the OOM kill or back-off from the events.
    - There is still exactly one incident and one resolved message.
    - The Fireworks reply is still not empty with the larger prompt. The model thinks first, with `max_tokens` 10000.
  spec_checkpoint: true
  done_checkpoint: true
