- id: "8"
  title: "Lower priority: send Grafana alerts to Keep"
  description: |-
    Priority: LOWER, after the nine main stories. Size: 1 to 2 days. Comes after: story 3 (in practice after story 6a, so the real key is checked). Capability: CAP-9.

    In one line: make Grafana's own alerts reach Keep through a webhook.

    Problem
    - Keep hears only from Prometheus rules, through Alertmanager.
    - Grafana's own alerts go nowhere. A fault seen in Grafana never joins an incident.

    Outcome
    - On AKS, Grafana has a webhook contact point and a notification policy that post to Keep at `/alerts/event/grafana`.
    - Auth: for Grafana newer than 9.4.7, Keep's own setup uses the contact point's `authorization_scheme` `digest` with `authorization_credentials` set to the key (Keep `grafana_provider.py:574-581`, commit e5cd8698). Keep accepts the Digest scheme (`keep/identitymanager/authverifierbase.py:320`). This replaces the `X-API-KEY` header that research.md mentions.
    - kube-prometheus-stack 52.0.0 ships Grafana chart 6.60.* (Grafana 10).
    - Grafana reads the existing Secret `alertmanager-keep-auth` (same `monitoring` namespace, same `prometheus-stack` release) through an environment variable used by its provisioning file. The settings go in `infra/azure/chart-values/prometheus-stack.yaml`, where one target owns the release (AD-012). There is no new copy of the key.
    - A sample Grafana alert rule is kept as a file in the repo. It uses a condition that no Prometheus rule covers (note this in `plan.md`). It has one of the four severities Keep's Grafana map knows: critical, high, warning or info (`grafana_provider.py:120-125`; anything else becomes info, `:413`).
    - When the sample alert fires, it appears in Keep with that severity. It resolves when it clears.

    Out of scope
    - Changing the correlation rule so Grafana alerts join the robot-shop incident (a separate decision).
    - Replacing or removing Alertmanager. Moving Prometheus rules into Grafana. Slack from Grafana. EKS and k3d.
    - A new decision (AD) is added only if the builder finds that Grafana 10 cannot read the Secret this way.

    Must keep working
    - Grafana at `/grafana`, its admin login and its dashboards.
    - Story 3's Alertmanager path to Keep, and the whole main chain.
    - `make setup-aks` without Keep secrets.
    - `make setup-local` and EKS.
    - `make lint`, including its secrets check.

    Decisions followed: AD-012 rule 3 (it now says Grafana also reads the key Secret), AD-008 rule 4, AD-009 rules 2 and 3.

    Live checks on AKS
    - Delivery: a test notification from Grafana reaches Keep. It is accepted with the real key and refused with a wrong one (the login is on by then).
    - Severity: the sample alert shows in Keep with the severity set on it, not as info.
    - No secret: `helm get values` and `helm get manifest` for `prometheus-stack` show no key value. The Secret that holds the key is not named `keep-*`.
    - Key change: a changed key file, after a re-run of the targets involved, still delivers. Grafana is restarted after the key change, because environment variables are read at start (AD-008 rule 4).
    - Nothing was tried before: confirm the live Grafana version, check the contact point and policy provisioning with the digest scheme on it, and write the result in `plan.md`.
