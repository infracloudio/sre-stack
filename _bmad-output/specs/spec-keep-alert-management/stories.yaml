- id: "4"
  title: One incident per fault, from a correlation rule created by an idempotent script
  description: |-
    Priority: main. Size: 1 to 2 days. Needs: story 3. AD numbers: AD-011 (rules 1, 4 and 5), AD-009 (rules 2 and 3), AD-008 (rule 2). Capabilities: CAP-4, CAP-7 (the rule part).

    Problem: Keep receives the alerts (story 3) but shows them one by one. A single fault produces five separate alerts, and nothing groups them into one incident.

    Outcome: `infra/azure/keep/correlation-rule.json` holds the correlation rule in the shape `POST /rules` takes, from the try-out (research.md section 5): CEL `namespace == "robot-shop"` with an `sqlQuery` object next to the `celQuery` (the API refuses the rule without it), `groupingCriteria` `[namespace]`, timeframe 600 seconds, threshold 3, `createOn` any, `resolveOn` all resolved. `setup-keep` creates it through the backend API: it opens `kubectl port-forward svc/keep-backend` on a free port chosen by kubectl and closes it on exit, and it sends the `admin` key. It lists the rules and matches by rule name: absent, it creates the rule; present and different, it updates it in place with `PUT /rules/{rule_id}`; identical, it does nothing. "Different" means the fields `correlation-rule.json` sets differ from the same fields in the `GET /rules` response. It does not compare the whole response, which adds an id, timestamps, an author and its own SQL form, and may name the rule `name` instead of `ruleName`. The builder records the request-to-response field mapping in `plan.md` from one live `GET`. Keep seeds the `admin` key from the generated `setup-api.key`, added to `sre-keep-api-keys` next to story 3's key under its own fingerprint name. If the backend is not reachable, `setup-keep` stops with a message instead of continuing. One cart OOM fault (`make aks-cart-oom-start`, load generator running) produces exactly one incident in Keep. It closes on its own after `make aks-cart-oom-revert` and the last alert clears. Running `make setup-keep` again leaves exactly one rule.

    Out of scope: Slack and Fireworks (stories 5a and 5b). The login (6a). Fixing Keep's own limits: a resolved incident's `end_time` stays empty and the UI labels rule-grouped alerts "Manually" (SPEC non-goals). Rules for hotrod. Any other correlation rule.

    Must keep working (AGENTS.md): stories 2 and 3 as built: `setup-keep` stays idempotent, Alertmanager still delivers. `make setup-aks` without Keep secrets still finishes, since the rule script runs only when Keep is installed. EKS and k3d are untouched. `make lint` passes, including shell lint on the new script.

    Live checks from the architecture decisions: (1) the seeded `setup` key is listed in Keep under its fingerprint name. Keep runs without a login in this story, so the check shows the key exists, not that the login accepts it; story 6a proves the second part; (2) the update path works live: change one field in `correlation-rule.json` (for example the window), re-run `make setup-keep`, and the same rule id changes with the rule count still one (`PUT /rules/{id}`, AD-011 rule 4); (3) a re-run with an unchanged file makes no write, which depends on the field comparison above.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Builder note: start from `tryout/`, read research.md section 5, run
    `make lint` and paste its output. No secrets in tracked files. Prove
