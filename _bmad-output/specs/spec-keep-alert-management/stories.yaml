- id: "3"
  title: Alertmanager on for AKS, sending firing and resolved alerts only to Keep
  description: |-
    Priority: main. Size: 1 to 2 days. Needs: stories 1 and 2. AD numbers: AD-012, AD-009 (rules 2 and 3), AD-008 (rules 2 and 4). Capability: CAP-3.

    Problem: Alertmanager is off, and its Slack setting in the shared values file is a placeholder that never worked. Even with rules (story 1) and Keep (story 2), no alert reaches Keep.

    Outcome: On AKS, Alertmanager runs and its only receiver is Keep, posting firing and resolved alerts to `http://keep-backend.keep.svc.cluster.local:8080/alerts/event/prometheus` with the receiver, timings and `routes: []` set as AD-012 says, in `infra/azure/chart-values/prometheus-stack.yaml`. The header comment of that AKS overlay records that the shared file was edited, departing from specs/005 (AD-012 rule 4). The broken Slack setting, the `P1 -> slack` route and the `slack` receiver are gone from `monitoring/chart-values/prometheus-values.yaml`, and that file keeps `alertmanager.enabled: false`. Keep seeds a `webhook` API key from the generated `keep-webhook-api.key` through `sre-keep-api-keys` (`KEEP_DEFAULT_API_KEYS`, key named with the fingerprint of its value). Alertmanager sends that key from the Secret `alertmanager-keep-auth` in `monitoring`, created by `setup-aks-prometheus-stack` before its `helm upgrade` from the same file, so the Alertmanager pod always starts. A test alert reaches Keep within one minute and shows as resolved after it clears. During the cart OOM fault, the alerts from story 1 appear in Keep and resolve after `make aks-cart-oom-revert`.

    Out of scope: the `admin` setup key (story 4). The login (story 6a), which is also where the real key checks are proven: Keep runs without a login until then and accepts any key. Any Slack or Fireworks wiring (story 5a). Grafana alerts. A second receiver of any kind.

    Must keep working (AGENTS.md): EKS and k3d render and install exactly as before: the output of `helm template` on the shared values alone is the same before and after the edit. `make setup-aks` without Keep secrets still finishes (Alertmanager then runs and logs failed deliveries, which AD-012 accepts). `setup-keep` never upgrades the `prometheus-stack` release. `make lint` passes.

    Live checks from the architecture decisions. Keep runs without a login (`NOAUTH`) in this story and accepts any API key, so "the key is accepted" proves nothing here; checks compare what exists, and never print a secret value. (1) The seeded key appears in Keep's API key list under its fingerprint name, and `alertmanager-keep-auth` holds the same value as `keep-webhook-api.key`, compared by hash (AD-009 rule 3); if seeding does not work, fall back to `POST /settings/apikey` and say so in `plan.md`. (2) The before-and-after `helm template` comparison of the shared values file, pasted into the pull request (AD-012 rule 4). (3) After a change to the key file and a re-run of both `setup-aks-prometheus-stack` and `make setup-keep`, the Secrets match the file and Keep lists the new fingerprint-named key; `plan.md` says who restarts `keep-backend` (`setup-keep`, when the Secret changed, because Keep reads `KEEP_DEFAULT_API_KEYS` only at pod start, AD-008 rule 4) and that Alertmanager's mounted file updates by itself. This check is the cut point if the story runs long.
