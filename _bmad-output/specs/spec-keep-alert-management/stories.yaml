- id: "9"
  title: "Lower priority: the incident summary includes the Kubernetes events behind it"
  description: |-
    Priority: LOWER, after the main nine. Size: 1 to 2 days. Needs: story 5a (in practice after 7). AD numbers: AD-011 (providers and workflows as files). No new decision. Capability: CAP-10.

    Problem: Prometheus shows that a container restarted, but Kubernetes events say why (for example `OOMKilled`, `BackOff`). The Slack summary is written from the alerts alone, so it often cannot name the reason. Keep cannot take Kubernetes events in as alerts: its `kubernetes` provider (`keep/providers/kubernetes_provider/kubernetes_provider.py`, commit e5cd8698) has no alert intake or webhook; it is a query provider with commands such as `get_events` for a namespace or a pod (lines 150, 170, 332-360), and it can use in-cluster credentials (`use_in_cluster_config`, lines 46 and 109). No event exporter appears in Keep's code or docs.

    Outcome: The opened-incident workflow (story 5a) gains a step that calls `get_events` for the `robot-shop` namespace through a Keep `kubernetes` provider, and passes the result into the Fireworks prompt. The provider uses the cluster's own credentials, is added to `providers.template.json`, and holds no secret. A Role and RoleBinding let the service account `keep` in the `keep` namespace (the chart renders `serviceAccountName: keep` on all Keep pods, already bound to the chart's own Role `secret-manager-role`) get and list events in `robot-shop` only; the Role and the binding live in `robot-shop`. During the cart OOM fault, the Slack summary names the OOM kill or the back-off, taken from those events.

    Out of scope: events as alerts in Keep (Keep cannot take them in), any event exporter, other namespaces, the resolved workflow. This story changes the opened workflow only.

    Must keep working (AGENTS.md): the main chain: one cart OOM fault still produces exactly one incident and one resolved message (events never become alerts). Story 5a's Slack message and link. `setup-keep` stays idempotent and restarts nothing when nothing changed. `make setup-aks` without Keep secrets still finishes. EKS and k3d untouched. `make lint` passes, including its secrets check.

    Live checks: (1) the provider and the access rule work in-cluster: events for `robot-shop` come back, events from another namespace are refused; (2) during the cart OOM fault the Slack summary names the OOM kill or back-off from the events; (3) there is still exactly one incident and one resolved message; (4) the Fireworks reply is still not empty with the larger prompt (the model reasons first, `max_tokens` 10000).
  spec_checkpoint: true
