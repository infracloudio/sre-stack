- id: "6b"
  title: Keep at its own address, keep.demo.local, with live updates
  description: |-
    Priority: main. Size: 1 to 2 days. Needs: story 6a. AD numbers: AD-010 (rules 1 to 4), AD-009 (rule 1, the `NEXTAUTH_URL` move), AD-005 (the host-matched pattern it extends). Capability: CAP-6 (address and live updates).

    Problem: Keep's UI is reachable only through `kubectl port-forward`, and there its live updates fail: the browser tries `ws://localhost:3000/websocket` and `wss://localhost/websocket` and both fail (try-out findings). A presenter has no address to open, and the "Open in Keep" link in Slack points nowhere.

    Outcome: Keep's UI and websocket are served at the root of `http://keep.demo.local`, through a host-matched `Gateway` and `VirtualService` pair in the `keep` namespace on the shared `istio: ingressgateway`, kept in `infra/azure/keep/istio-gateway.yaml`. That is the same file name as HotROD's `app/hotrod/istio-gateway.yaml` (applied at makefile line 345), but in the AKS-only folder AD-011 gives Keep. One `VirtualService` sends `/websocket/app/` to `keep-websocket:6001` with the prefix rewritten to `/app/`, and everything else to `keep-frontend:3000`. The backend gets no route. `NEXTAUTH_URL` in `frontend.env` becomes `http://keep.demo.local`, in the same pull request as the route (AD-009 rule 1). `setup-keep` applies the route only after confirming that both `keep-backend` and `keep-frontend` run with `AUTH_TYPE=DB`, and refuses otherwise (a frontend in `NOAUTH` skips the login page). `make get-service-endpoints` prints, for AKS, the address and the `/etc/hosts` line (`<LB_ENDPOINT> keep.demo.local`). Scripts and checks use `curl -H "Host: keep.demo.local"`. The address shows Keep's login page, the default user signs in, and new alerts appear without a refresh. Slack's "Open in Keep" link opens the incident.

    Out of scope: TLS (plain HTTP is accepted, AD-010). A nip.io hostname or a gateway port (rejected in AD-010, can be added later). A route to the backend. Any change to the shared gateway release. README and screenshots (story 7).

    Must keep working (AGENTS.md): HotROD at `hotrod.demo.local`, Grafana at `/grafana` and the other gateway routes. The login and the whole earlier chain (stories 3 to 6a): a cart OOM fault still ends in one incident and Slack messages. `make get-service-endpoints` output for k3d and EKS is unchanged. `make setup-keep` stays idempotent. `make setup-aks` without Keep secrets still finishes. `make lint` passes.

    Live checks from the architecture decisions: (1) the story starts with the check the try-out never ran: the narrow `/websocket/app/` route carries live updates, shown in the browser console connecting to `ws://keep.demo.local/websocket/app/keepappkey` and a new alert appearing without a refresh; if it fails, fall back to the whole `/websocket` prefix rewritten to `/` and say so in `plan.md` (AD-010 rule 1). This is a manual step on the operator's machine; attach the console line and a screenshot as evidence; (2) Soketi's HTTP publish API (`/apps/...`) is not reachable from outside through the route; (3) sign-in at `keep.demo.local` redirects back to `keep.demo.local`, not to localhost; (4) `setup-keep` refuses to apply the route while the backend is not on `AUTH_TYPE=DB`: run `kubectl set env deploy/keep-backend AUTH_TYPE=NOAUTH`, run the route step, show it refuses, then re-run `make setup-keep` to restore; no throwaway Keep is used; (5) HotROD and Grafana still answer through the same gateway.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Builder note: start from `tryout/`, read research.md section 5, run
