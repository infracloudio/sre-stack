- id: "10"
  title: "Lower priority: alerts based on Loki logs reach Keep"
  description: |-
    Priority: LOWER, after the main nine. Size: 1 to 2 days. Needs: story 3 (in practice after 6a, so the real key is checked). AD numbers: AD-012 (Alertmanager is the one receiver, set up in story 3). No new key and no new Secret. Capability: CAP-11.

    Problem: Some faults show up first in logs, such as the OOM kill, an error message or a crash loop, and Keep only hears about metrics. A log-based alert would add that signal to the same incident.

    Outcome: On AKS, at least one alert rule written on Loki logs, kept as a file in the repo, fires during the cart OOM fault and appears in Keep with a severity from the Prometheus provider's list (critical, error, high, warning or info, as in story 1) and `namespace` and `service` labels, and resolves when it clears. The route is the one already in place: Loki's built-in ruler (`ruler.enabled` is true by default in the pinned chart `grafana-community/loki` 18.13.7, makefile line 218) sends alerts to the existing Alertmanager through `loki.rulerConfig` (`alertmanager_url`), and Alertmanager already sends to Keep (story 3). The rule is kept next to story 1's, in `infra/azure/alert-rules/`, and sets `namespace` `robot-shop` and a `severity` label explicitly. The chart's rules sidecar is on by default (`sidecar.rules.enabled: true`) and loads ConfigMaps labelled `loki_rule`, so the rule reaches Loki as such a ConfigMap.

    Out of scope: changing the correlation rule so the log alert joins the robot-shop incident, unless the live check shows it must. Moving the metric rules into Loki. Dashboards. Slack changes. A Grafana-managed alert on a Loki query, which is dropped unless the ruler route fails live. EKS and k3d.

    Must keep working (AGENTS.md): Loki's log intake and the Grafana log views. Story 3's Alertmanager path. One cart OOM fault still produces exactly one incident and one resolved message, unless the story proves otherwise and says so in `plan.md`. `make setup-aks` without Keep secrets still finishes. `make setup-local` and EKS untouched. `make lint` passes, including its secrets check.

    Live checks: (1) in Monolithic mode, which pod runs the ruler and which runs the sidecar, the tenant folder the rule must sit in (authentication is on by the chart default, per `infra/azure/chart-values/loki.yaml`), and the Alertmanager Service name read from the cluster, are confirmed and recorded in `plan.md`; (2) the log alert fires during the fault and reaches Keep with its set severity, not as info (Keep reads `labels.severity`, research.md); (3) the log alert's labels and the correlation rule are compared on a real fault: the result, whether it joins the one incident or opens a second, is recorded; (4) no secret: `helm get values` and `helm get manifest` for `loki` and `prometheus-stack` show no key value.
