- id: "7"
  title: Make the demo repeatable from the README
  description: |-
    Priority: main. Size: 1 to 2 days. Comes after: stories 5b and 6b. Capability: CAP-8.

    In one line: write the README section, diagram and screenshots, and make the scenario point at Keep and Slack, so anyone can run the demo in one take.

    Problem
    - Every part of the alert story works, but only the people who built it know the steps.
    - A presenter cannot run it in one take. A newcomer cannot follow it.

    Outcome
    - The README has an "Alert management (Keep)" section, next to the AKS monitoring sections. It has:
      - a Mermaid diagram: fault, Prometheus rules, Alertmanager, Keep incident, Fireworks summary, Slack;
      - setup steps: the two files the operator must supply in the secrets folder (`fireworks.key`, `slack-webhook.url`), where the generated login password is (the file, never printed), and the `/etc/hosts` line from `make get-service-endpoints`;
      - demo steps for the cart OOM fault and its revert. They start the load generator before the fault, because `make setup-aks` only prints its commands (makefile lines 309-310), and without traffic the 5xx and slow-request alerts do not fire;
      - a note that the incident closes about 8 minutes after the revert (in the try-out the payment latency alert cleared last), so a presenter knows to wait;
      - screenshots of the incident with its grouped alerts, the Slack summary and a workflow run.
    - The cart OOM scenario's start command prints where to watch: the Keep address and a pointer to the Slack channel. The pointer is printed before the `RESULT:` line, so `RESULT:` stays the last line (`specs/007-aks-oom-kill/contracts/commands.md` section 3). It prints this on start's success paths only, nothing on revert, and nothing about Keep when Keep is not installed. The contract file is updated in the same pull request.
    - The success signal reads: after `make setup-aks` and starting the load generator, the fault starts. One incident and an accurate Slack summary appear within about two minutes. After `make aks-cart-oom-revert`, the incident closes by itself and Slack gets one resolved message.
    - "Nothing by hand" means: the operator supplies `fireworks.key` and `slack-webhook.url` and adds the `/etc/hosts` line once. Nothing else.
    - Someone new to the repo can follow only the README on AKS.

    Out of scope
