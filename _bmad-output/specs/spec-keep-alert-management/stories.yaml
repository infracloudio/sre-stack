    Priority: main. Size: 1 to 2 days. Needs: stories 5b and 6b. AD numbers: AD-008 (rule 1, the supplied files; rule 5, the skip), AD-010 (rule 3, the address and the hosts line). Capability: CAP-8.

    Problem: Every part of the alert story works, but only someone who built it knows the steps. A presenter cannot run it in one take, and a newcomer cannot follow it.

    Outcome: The README has an "Alert management (Keep)" section, placed with the AKS monitoring sections, with: an architecture diagram as a Mermaid block (fault, Prometheus rules, Alertmanager, Keep incident, Fireworks summary, Slack); the setup steps, including the two files the operator must supply in the secrets folder (`fireworks.key`, `slack-webhook.url`), where the generated login password is (the file, never printed), and the `/etc/hosts` line from `make get-service-endpoints`; the demo steps for the cart OOM fault and its revert, which start the load generator before the fault, because `make setup-aks` only prints its commands (makefile lines 309-310) and without traffic the 5xx and slow-request alerts do not fire; the note that the incident closes about 8 minutes after the revert (the payment latency alert clears last in the try-out), so a presenter knows to wait; and screenshots of the incident with its grouped alerts, the Slack summary and a workflow run. The cart OOM scenario's start command prints where to watch (the Keep address and a pointer to the Slack channel). The pointer is printed before the `RESULT:` line so that `RESULT:` stays the last line (`specs/007-aks-oom-kill/contracts/commands.md` section 3), on start's success paths only, nothing on revert, and nothing about Keep when Keep is not installed. The contract file is updated in the same pull request. The success signal reads: after `make setup-aks` and starting the load generator, the fault starts, one incident and an accurate Slack summary appear within about two minutes, and after `make aks-cart-oom-revert` the incident closes by itself and Slack gets one resolved message. "Nothing by hand" means: the operator supplies `fireworks.key` and `slack-webhook.url` and adds the `/etc/hosts` line once; nothing else. Someone new to the repo can follow only the README on AKS.

