# Try-out override (2026-10-23), layered after prometheus-values.yaml and
# infra/azure/chart-values/prometheus-stack.yaml. Turns Alertmanager on and
# sends every alert to Keep only. Reverted with: helm rollback prometheus-stack 1
alertmanager:
  enabled: true
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/keep-alertmanager-auth/
    secrets:
      - keep-alertmanager-auth
  config:
    global:
      # Base values carry a placeholder Slack URL; drop it.
      slack_api_url: null
      resolve_timeout: 5m
    route:
      receiver: keep
      group_by: ['alertname', 'namespace']
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 1h
      # Base values add a P1 -> slack sub-route; maps merge, so empty it here.
      routes: []
    receivers:
      - name: 'null'
      - name: keep
        webhook_configs:
          - url: http://keep-backend.keep.svc.cluster.local:8080/alerts/event/prometheus
            send_resolved: true
            http_config:
              basic_auth:
                username: api_key
                password_file: /etc/alertmanager/secrets/keep-alertmanager-auth/api-key
