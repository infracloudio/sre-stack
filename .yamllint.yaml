  app/robot-shop/helm/templates/dispatch-deployment.yaml
  app/robot-shop/helm/templates/mongodb-deployment.yaml
  app/robot-shop/helm/templates/mysql-config.yaml
  app/robot-shop/helm/templates/mysql-secret.yaml
  app/robot-shop/helm/templates/mysql-seeed-job.yaml
