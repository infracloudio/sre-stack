# Relaxed yamllint config for a YAML-dominant glue repo: catch structural
# errors, ignore style noise (line length, doc markers) that the existing
# files were never held to.
extends: default

rules:
  line-length: disable
  document-start: disable
  truthy: disable
  comments:
    min-spaces-from-content: 1
  indentation:
    indent-sequences: consistent

# Ratchet: legacy files with pre-existing yamllint errors are ignored here so
# `make lint` passes without either (a) mass-fixing unrelated files in an
# unrelated PR or (b) disabling the rules for everyone.
#
# The list only shrinks. When a PR touches one of these files, fixing its
# yamllint findings and removing the entry from this list is part of that PR.
# Never add a file to this list: new files are held to the full standard.
ignore: |
  app/hotrod/base/hotrod/deployment.yaml
  app/hotrod/kustomization.yaml
  app/robot-shop/helm/Chart.yaml
  app/robot-shop/helm/templates/cart-deployment.yaml
