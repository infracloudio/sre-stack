name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shellcheck and yamllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          pip install --quiet yamllint

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: make lint
        run: make lint
        env:
          STRICT: "1"

  gate-label:
    name: gate:plan-approved check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require gate:plan-approved when specs/ changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          if ! printf '%s\n' "$files" | grep -q '^specs/'; then
            echo "Diff does not touch specs/ — gate not required."
            exit 0
          fi
          if gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qxF 'gate:plan-approved'; then
            echo "gate:plan-approved present ✔"
          else
            echo "::error::PR changes specs/ but 'gate:plan-approved' label is missing. Get Architect approval of the plan, then apply the label before merge."
            exit 1
          fi
